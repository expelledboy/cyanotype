apiVersion: v1
kind: Namespace
metadata:
  name: cyanotype-attach-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attach-nginx
  namespace: cyanotype-attach-tests
  labels:
    app: attach-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attach-nginx
  template:
    metadata:
      labels:
        app: attach-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: attach-nginx
  namespace: cyanotype-attach-tests
spec:
  type: ClusterIP
  selector:
    app: attach-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
