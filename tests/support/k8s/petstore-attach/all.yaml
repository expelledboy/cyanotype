apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-door
  namespace: cyanotype-petstore-attach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-door
  template:
    metadata:
      labels:
        app: front-door
        cyanotype.component: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: front-door-conf
---
apiVersion: v1
kind: Service
metadata:
  name: front-door
  namespace: cyanotype-petstore-attach
spec:
  type: ClusterIP
  selector:
    app: front-door
  ports:
    - port: 80
      targetPort: 8080
