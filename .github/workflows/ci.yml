name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege — CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`, so CI and release run the same Bun.
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # tests/core/ — Docker adapter tests self-skip when no daemon is present.
      - name: Test
        run: bun run test

      - name: Verify pack contents
        run: bun pm pack --dry-run
