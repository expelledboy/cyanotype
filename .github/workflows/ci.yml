name: CI

on:
  # PULL REQUESTS ONLY, and that is now a decision rather than an inheritance.
  #
  # A push trigger on master would be redundant: the pre-merge run already
  # validates the merge result. The question worth asking was the other one —
  # what changes CI's inputs WITHOUT a pull request? Exactly one thing: the
  # monthly mirror refresh, which moves the upstream images every job pulls.
  # That is why `mirror-images.yml` opens a pull request instead of pushing, so
  # the refresh is checked by this workflow like anything else.
  #
  # With that closed there is nothing a scheduled run would catch that this
  # does not, and a schedule would produce failures on the default branch at a
  # time nobody is watching.
  pull_request:
    branches: [master]

# Least privilege — CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint / typecheck / build / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`, so CI and release run the same Bun.
          bun-version: "1.3.14"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun test tests/core/
      - run: bun pm pack --dry-run
      # Everything above runs inside our own node_modules, where zod resolves
      # to one copy and @types/bun is always present. A consumer's project has
      # neither guarantee. Two defects reached v0.7.1 through that blind spot,
      # so this compiles a real consumer against the packed tarball on each
      # zod major the peerDependencies range promises.
      - run: bun scripts/check-consumer-types.ts

  docker:
    name: docker substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      - run: bun scripts/prime-images.ts
      - run: just build-test-images

      # CYANOTYPE_REQUIRE_DOCKER turns an unreachable daemon into a failure
      # rather than a skip. This job provisions one, so its absence would mean
      # the provisioning silently did nothing — which is the defect the skip
      # rework exists to make visible.
      - name: Adapter suites
        env:
          CYANOTYPE_REQUIRE_DOCKER: "1"
        run: bun test tests/substrate/

      - name: Petstore example — in-memory, Docker, Docker Compose attach
        env:
          CYANOTYPE_REQUIRE_DOCKER: "1"
        run: |
          just test-petstore-memory
          just test-petstore-docker
          just test-petstore-docker-attach

      - run: just check-no-leaks

  kubernetes:
    name: kubernetes substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile

      # Both pinned for the same reason Bun is: the runner image's own versions
      # move without a commit here, and this job exists to detect changes in
      # THIS repository's behaviour. kubectl is not incidental — the adapter
      # shells out to it for every cluster operation (D-019).
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.33.0
          # Matches kind v0.33.0's default node image (kindest/node:v1.37.0).
          # Kubernetes supports kubectl within one minor of the API server, so
          # these two move together or the skew check is the thing that breaks.
          KUBECTL_VERSION: v1.37.0
        run: |
          curl -sSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -sSLo ./kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x ./kind ./kubectl
          sudo mv ./kind ./kubectl /usr/local/bin/
          kubectl version --client

      - run: bun scripts/prime-images.ts
      - run: just build-test-images
      - run: just kind-up
      - run: bun scripts/k8s-load-images.ts

      # The ADAPTER suites, not the petstore example: D-049 in docs/decisions.md.
      - name: Kubernetes adapter suites
        env:
          CYANOTYPE_REQUIRE_K8S: "1"
        run: |
          set -o pipefail
          bun test tests/substrate/kubernetes.test.ts tests/substrate/kubernetes-attach.test.ts 2>&1 | tee k8s.log
          # A TEST count cannot tell a real run from one whose bodies return
          # early — that is precisely the defect this job exists to prevent, so
          # it would be absurd to guard it with the one number that cannot see
          # it. An ASSERTION count can: 17 from kubernetes.test.ts and 37 from
          # the attach suite, both measured against a live cluster.
          expected=54
          actual=$(grep -oE '[0-9]+ expect\(\) calls' k8s.log | grep -oE '^[0-9]+')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected $expected assertions from the Kubernetes adapter suites, saw ${actual:-none}."
            echo "Fewer means a test stopped asserting; more means one was added. Update this number deliberately."
            exit 1
          fi

      - run: just kind-down
        if: always()
