# Release workflow — publishes @expelledboy/speculum to npm on tag push.
#
# Authentication: npm Trusted Publishers (OIDC, GA 2025-07-31).
#   No NPM_TOKEN secret — the npm CLI exchanges a GitHub Actions OIDC ID
#   token for a short-lived registry credential. Requires `id-token: write`
#   and a Trusted Publisher entry on npmjs.com pointing at this repo +
#   workflow filename (`release.yml`). Once configured, every publish is
#   tokenless and provenance-attested automatically — no `--provenance`
#   flag needed.
#
# First-publish bootstrap (one-time, before this workflow can run):
#   The Trusted Publisher UI lives at
#   https://www.npmjs.com/package/@expelledboy/speculum/access — but that
#   URL only exists once the package does. So:
#     1. Generate a short-lived Granular Access Token on npmjs.com
#        (Account → Access Tokens → Granular, scope @expelledboy/speculum
#        write, 7-day expiry).
#     2. Locally: `NODE_AUTH_TOKEN=<token> npm publish --access public`
#        (or use any one-shot CI job with the token). This lays down the
#        first version on npm.
#     3. On npmjs.com → @expelledboy/speculum → Settings → Trusted
#        Publisher → Add → GitHub Actions:
#          Organization or user: expelledboy
#          Repository:           speculum
#          Workflow filename:    release.yml
#     4. Revoke the bootstrap token.
#   Every subsequent tag-push then runs this workflow tokenlessly and
#   ships with auto-provenance.
#
# How to cut a release after bootstrap:
#   1. Move CHANGELOG.md `[Unreleased]` entries to a dated version block.
#   2. Bump `version` in package.json if needed.
#   3. Commit:  `git commit -am "chore: release v0.1.x"`.
#   4. Tag:     `git tag v0.1.x`.
#   5. Push:    `git push && git push --tags`.
#
# Why npm (not bun publish):
#   `bun publish` does not yet participate in npm Trusted Publishers.
#   We use `npm publish` (Node 24 ships npm >= 11.5, required for OIDC);
#   Bun still drives install, typecheck, build, and test.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for the GitHub Release step
      id-token: write   # for npm Trusted Publishers OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck + build + test)
        run: bun run prepublishOnly

      - name: Setup Node (npm >= 11.5 for Trusted Publishers OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.0.8
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
